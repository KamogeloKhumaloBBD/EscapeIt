name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    env:
      PRODUCTION_WEB_URL: ${{ vars.PRODUCTION_WEB_URL }}
      RAILWAY_ENVIRONMENT: production
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_CLI_VERSION: 5.37.7
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Check out verified revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_SHA }}

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RAILWAY_TOKEN" || { echo "RAILWAY_TOKEN is not configured." >&2; exit 1; }
          test -n "$RAILWAY_PROJECT_ID" || { echo "RAILWAY_PROJECT_ID is not configured." >&2; exit 1; }
          test -n "$PRODUCTION_WEB_URL" || { echo "PRODUCTION_WEB_URL is not configured." >&2; exit 1; }
          case "$PRODUCTION_WEB_URL" in
            https://*) ;;
            *) echo "PRODUCTION_WEB_URL must be an HTTPS origin." >&2; exit 1 ;;
          esac

      - name: Detect production service changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          detect() {
            bash scripts/detect-railway-service-changes.sh "$@"
          }

          flyway_result="$(detect flyway "$TARGET_SHA" \
            packages/db/migrations \
            packages/db/Dockerfile.flyway \
            railway.flyway.json \
            .dockerignore)"
          slm_result="$(detect slm "$TARGET_SHA" \
            apps/slm \
            railway.slm.json \
            .dockerignore)"
          api_result="$(detect api "$TARGET_SHA" \
            apps/api \
            packages/db \
            packages/email \
            packages/integrations \
            packages/mcp-runtime \
            packages/security \
            railway.api.json \
            package.json \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            tsconfig.base.json \
            .dockerignore)"
          mcp_result="$(detect mcp "$TARGET_SHA" \
            apps/mcp \
            packages/db \
            packages/integrations \
            packages/mcp-runtime \
            packages/security \
            railway.mcp.json \
            package.json \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            tsconfig.base.json \
            .dockerignore)"
          web_result="$(detect web "$TARGET_SHA" \
            apps/web \
            railway.web.json \
            package.json \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            tsconfig.base.json \
            .dockerignore)"
          digest_cron_result="$(detect digest-cron "$TARGET_SHA" \
            apps/digest-cron \
            railway.digest-cron.json \
            .dockerignore)"

          flyway_changed="${flyway_result%%$'\t'*}"
          slm_changed="${slm_result%%$'\t'*}"
          api_changed="${api_result%%$'\t'*}"
          mcp_changed="${mcp_result%%$'\t'*}"
          web_changed="${web_result%%$'\t'*}"
          digest_cron_changed="${digest_cron_result%%$'\t'*}"
          any_changed=false
          if [[ "$flyway_changed" == "true" || "$slm_changed" == "true" || "$api_changed" == "true" || "$mcp_changed" == "true" || "$web_changed" == "true" || "$digest_cron_changed" == "true" ]]; then
            any_changed=true
          fi

          {
            echo "flyway_changed=$flyway_changed"
            echo "slm_changed=$slm_changed"
            echo "api_changed=$api_changed"
            echo "mcp_changed=$mcp_changed"
            echo "web_changed=$web_changed"
            echo "digest_cron_changed=$digest_cron_changed"
            echo "any_changed=$any_changed"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Production deployment selection"
            echo
            echo "- Flyway: ${flyway_result#*$'\t'}"
            echo "- SLM: ${slm_result#*$'\t'}"
            echo "- API: ${api_result#*$'\t'}"
            echo "- MCP: ${mcp_result#*$'\t'}"
            echo "- Web: ${web_result#*$'\t'}"
            echo "- Digest cron: ${digest_cron_result#*$'\t'}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy Flyway
        if: steps.changes.outputs.flyway_changed == 'true'
        shell: bash
        run: |
          bash scripts/deploy-railway-service.sh flyway "$TARGET_SHA"

      - name: Deploy SLM
        if: steps.changes.outputs.slm_changed == 'true'
        shell: bash
        run: |
          bash scripts/deploy-railway-service.sh slm "$TARGET_SHA"

      - name: Deploy API
        if: steps.changes.outputs.api_changed == 'true'
        shell: bash
        run: |
          bash scripts/deploy-railway-service.sh api "$TARGET_SHA"

      - name: Deploy MCP
        if: steps.changes.outputs.mcp_changed == 'true'
        shell: bash
        run: |
          bash scripts/deploy-railway-service.sh mcp "$TARGET_SHA"

      - name: Deploy web
        if: steps.changes.outputs.web_changed == 'true'
        shell: bash
        run: |
          bash scripts/deploy-railway-service.sh web "$TARGET_SHA"

      - name: Deploy digest cron
        if: steps.changes.outputs.digest_cron_changed == 'true'
        shell: bash
        run: |
          bash scripts/deploy-railway-service.sh digest-cron "$TARGET_SHA"

      - name: Run smoke checks
        if: steps.changes.outputs.any_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          origin="${PRODUCTION_WEB_URL%/}"
          curl --fail --silent --show-error \
            --location \
            --retry 5 --retry-all-errors --retry-delay 5 \
            --max-time 30 \
            --output /dev/null \
            "$origin/"

          health="$(curl --fail --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 5 \
            --max-time 30 \
            "$origin/api/health")"

          HEALTH_RESPONSE="$health" node -e '
            const health = JSON.parse(process.env.HEALTH_RESPONSE ?? "{}");
            if (health.status !== "ok" || health.database !== "up") {
              console.error("Production API health response is not healthy.");
              process.exit(1);
            }
          '

          metadata="$(curl --fail --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 5 \
            --max-time 30 \
            "$origin/.well-known/oauth-protected-resource/api/mcp")"

          MCP_METADATA="$metadata" EXPECTED_ORIGIN="$origin" node -e '
            const metadata = JSON.parse(process.env.MCP_METADATA ?? "{}");
            const origin = process.env.EXPECTED_ORIGIN;
            if (
              metadata.resource !== `${origin}/api/mcp` ||
              !Array.isArray(metadata.authorization_servers) ||
              !metadata.authorization_servers.includes(`${origin}/api/auth`) ||
              !Array.isArray(metadata.scopes_supported) ||
              !metadata.scopes_supported.includes("mcp:access")
            ) {
              console.error("Production MCP discovery metadata is invalid.");
              process.exit(1);
            }
          '

          mcp_headers="$(mktemp)"
          mcp_body="$(mktemp)"
          trap 'rm -f "$mcp_headers" "$mcp_body"' EXIT
          mcp_status="$(curl --silent --show-error \
            --max-time 30 \
            --dump-header "$mcp_headers" \
            --output "$mcp_body" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            "$origin/api/mcp")"

          test "$mcp_status" = "401" || {
            echo "Production MCP endpoint returned HTTP $mcp_status without a credential." >&2
            exit 1
          }
          grep --ignore-case --quiet \
            '^www-authenticate: Bearer .*scope="mcp:access"' \
            "$mcp_headers" || {
              echo "Production MCP authentication challenge is missing or invalid." >&2
              exit 1
            }

          MCP_ERROR_BODY="$(cat "$mcp_body")" node -e '
            const body = JSON.parse(process.env.MCP_ERROR_BODY ?? "{}");
            if (body?.error?.code !== -32001 || body?.jsonrpc !== "2.0") {
              console.error("Production MCP authentication response is invalid.");
              process.exit(1);
            }
          '
